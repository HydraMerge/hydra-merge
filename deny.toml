# cargo-deny: known vulnerabilities, licenses and crate sources of every dependency.
# Run locally with `cargo deny check`; CI runs the same command (.github/workflows/ci.yml).

[graph]
# The six release targets. Dependencies of other platforms never ship, so they are not checked.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
# RustSec advisory database: a crate with a known vulnerability fails the check.
# An accepted advisory goes into `ignore` with its id and the reason, never silently.
# The three below are "unmaintained" notices, not vulnerabilities (issued 2026-10-17). The crates
# were merged into `zbus` 6.0.0. They reach only the Linux builds, through
# eframe -> egui-winit -> accesskit_winit -> accesskit_unix -> atspi -> zbus 5, the screen reader
# bridge. The newest accesskit_unix (0.24) and atspi (0.30) still depend on zbus 5, so nothing
# can be upgraded yet. Drop these entries once that chain moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zbus_names is unmaintained; merged into zbus 6, which accesskit_unix does not use yet" },
    { id = "RUSTSEC-2026-0371", reason = "zvariant is unmaintained; merged into zbus 6, which accesskit_unix does not use yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained; merged into zbus 6, which accesskit_unix does not use yet" },
]

[licenses]
# Every license in the tree must be compatible with shipping the binary under MIT.
# A dual-licensed crate (for example "Apache-2.0 OR GPL-2.0-only") passes through its
# permissive option, so GPL and LGPL are deliberately not listed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# egui, wgpu and winit pull several versions of windows-sys, bitflags and similar crates;
# that is reported, not failed.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Dependencies come from crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
