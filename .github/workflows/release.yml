name: release

on:
  push:
    tags: ["v*"]

# Read-only token for every job; a job that writes (release `publish`) asks for more itself.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            bin: hydra-merge
          - os: macos-26-intel
            target: x86_64-apple-darwin
            bin: hydra-merge
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: hydra-merge
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: hydra-merge
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bin: hydra-merge.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: hydra-merge.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgtk-3-dev
      - name: Release build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          name="hydra-merge-${GITHUB_REF_NAME}-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            sh scripts/package-macos-app.sh "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${GITHUB_REF_NAME#v}"
            ditto -c -k --keepParent HydraMerge.app "${name}.zip"
          else
            mkdir -p dist
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
            tar -C dist -czf "${name}.tar.gz" "${{ matrix.bin }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-merge-${{ matrix.target }}
          path: hydra-merge-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Sigstore signing of the build provenance and storing it as a GitHub attestation.
      id-token: write
      attestations: write
    steps:
      # Only for .github/release-notes.md, the text of the release.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # winget installs a portable app from a .zip, not from a .tar.gz. The app updates itself from
      # the .tar.gz, so both stay. They go in before the checksums and the attestation.
      - name: Windows zip archives
        run: |
          for archive in dist/hydra-merge-*-pc-windows-msvc.tar.gz; do
            work=$(mktemp -d)
            tar -xzf "$archive" -C "$work"
            out="$PWD/${archive%.tar.gz}.zip"
            (cd "$work" && zip -q -9 "$out" hydra-merge.exe)
            rm -rf "$work"
          done
      - name: Checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS)
      # Attests exactly the archives that are published below, so
      # `gh attestation verify <archive> --repo HydraMerge/hydra-merge` ties a download to this
      # workflow run and tag. SHA256SUMS is not attested: it is derived from the archives.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/hydra-merge-*
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md

  # Package manager files for this release: a Homebrew cask and formula, winget manifests.
  packages:
    name: packages
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checksums of the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS --dir release
      - name: Render the package files
        run: sh scripts/render-packages.sh "${GITHUB_REF_NAME#v}" release/SHA256SUMS packages "$(date -u +%Y-%m-%d)"
      # The winget manifests are submitted by hand or by a later job; see docs/packaging.md.
      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: packages
          if-no-files-found: error
      # Needs the secret TAP_TOKEN (docs/packaging.md); without it the tap is simply left as it is.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::TAP_TOKEN is not set, so the Homebrew tap was not updated"
            exit 0
          fi
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/HydraMerge/homebrew-tap.git" tap
          cp -R packages/homebrew/. tap/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The tap already has this version"
            exit 0
          fi
          git commit --quiet -m "hydra-merge ${GITHUB_REF_NAME#v}"
          git push --quiet origin HEAD
