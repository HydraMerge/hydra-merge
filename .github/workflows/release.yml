name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            bin: hydra-merge
          - os: macos-26-intel
            target: x86_64-apple-darwin
            bin: hydra-merge
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: hydra-merge
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: hydra-merge
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bin: hydra-merge.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: hydra-merge.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgtk-3-dev
      - name: Release build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          name="hydra-merge-${GITHUB_REF_NAME}-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            sh scripts/package-macos-app.sh "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${GITHUB_REF_NAME#v}"
            ditto -c -k --keepParent HydraMerge.app "${name}.zip"
          else
            mkdir -p dist
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
            tar -C dist -czf "${name}.tar.gz" "${{ matrix.bin }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-merge-${{ matrix.target }}
          path: hydra-merge-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "macOS archives contain HydraMerge.app. Linux and Windows archives contain the hydra-merge binary. x86_64 and arm64."
